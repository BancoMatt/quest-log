<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Quest Log</title>
<meta name="theme-color" content="#14161F" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Quest Log" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.supabase.in wss://*.supabase.co; font-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'" />
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>
<style>
  :root{
    --bg:#14161F; --panel:#1C1F2B; --panel2:#232735; --line:rgba(255,255,255,.06);
    --text:#E6E8EE; --muted:#8A90A2; --gold:#F2B14C; --violet:#8B7CF0; --green:#56C596;
    --markets:#F2B14C; --health:#56C596; --knowledge:#5AA9E6; --business:#C77DFF; --productivity:#F28C6A; --consistency:#E8D44D;
    --bronze:#C77B45; --silver:#B9C0CC; --goldt:#F2C14C; --plat:#63E6D2; --diamond:#7FC9FF;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    -webkit-user-select:none;user-select:none;overscroll-behavior-y:contain}
  body{padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 44px)}
  .wrap{max-width:480px;margin:0 auto}
  .mono{font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}
  button{font-family:var(--sans)}

  header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
  .eyebrow{font-size:11px;color:var(--muted)}
  .day{font-size:20px;font-weight:600;margin-top:2px}
  .chips{display:flex;gap:8px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:7px 11px}
  .streak{display:flex;align-items:center;gap:6px;font-size:13px}
  .lvlwrap{min-width:74px}
  .lvltop{display:flex;align-items:baseline;gap:5px}
  .lvltrack{height:3px;background:rgba(139,124,240,.2);border-radius:3px;margin-top:5px;overflow:hidden}
  .lvlfill{height:100%;background:var(--violet);border-radius:3px;transition:width .45s cubic-bezier(.2,.8,.2,1)}

  .toptabs{display:flex;gap:6px;margin-bottom:16px}
  .ttab{flex:1;text-align:center;padding:10px 5px;border-radius:11px;border:1px solid var(--line);background:var(--panel);white-space:nowrap;font-size:13px;
    color:var(--muted);font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;font-size:12px;cursor:pointer}
  .ttab.on{background:var(--panel2);color:var(--text);border-color:var(--gold)}
  .pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:20px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .pager::-webkit-scrollbar{display:none}
  .pane{flex:0 0 100%;min-width:100%;scroll-snap-align:start;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:26px}
  .pager{will-change:height}
  .foodtot .kcal-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .kcal-big{font-size:34px;font-weight:800;line-height:1}
  .kcal-ring{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .kcal-ring span{width:44px;height:44px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:11px}
  .mb{margin:8px 0}
  .mb-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
  .mb-track{height:7px;background:var(--panel2);border-radius:5px;overflow:hidden}
  .mb-fill{height:100%;border-radius:5px;transition:width .3s}
  .micros{font-size:10.5px;color:var(--muted);margin-top:10px;letter-spacing:.3px}
  #foodResults{margin-top:4px}
  .foodres{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
  .fr-nm{font-size:14px;font-weight:600}
  .fr-sub{font-size:11px;color:var(--muted);margin-top:2px}
  .fr-add{color:var(--gold);flex-shrink:0}
  .foodentry .rbody{cursor:default}
  .foodsearch{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px 6px 4px 12px}
  .foodsearch .fs-ico{color:var(--muted);flex-shrink:0;cursor:pointer;display:flex}
  .foodsearch .fs-ico .ico{width:17px;height:17px}
  .foodsearch input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--text);font-size:14.5px;padding:9px 2px}
  .fs-btn{flex-shrink:0;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .fs-btn .ico{width:18px;height:18px}
  .fs-btn.on{border-color:var(--gold);color:var(--gold)}
  .micros-acc{margin-top:10px}
  .microgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
  .mgcell{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--line)}
  .mgcell span{color:var(--muted)}
  .mealpick{display:flex;gap:6px;margin-top:10px}
  .mealopt{flex:1;padding:8px 4px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:11.5px;cursor:pointer}
  .mealopt.on{border-color:var(--gold);color:var(--gold)}
  .mealhd{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;color:var(--muted);margin:6px 4px 6px}
  .kchart{position:relative;display:flex;align-items:flex-end;gap:7px;height:120px;padding-top:6px}
  .kbar{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
  .kbwrap{width:100%;flex:1;display:flex;align-items:flex-end}
  .kbfill{width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px;transition:height .3s}
  .kbfill.over{background:#e06c75}
  .kbar.today .kbl{color:var(--gold)}
  .kbl{font-size:9px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
  .kredline{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed #e06c75;opacity:.8;z-index:2}
  .waterbtns{display:flex;gap:8px;align-items:center;margin-top:10px}
  .waterbtns button{padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:12.5px;cursor:pointer}
  .waterbtns .hint{margin-left:auto}
  .wmodes{display:flex;gap:6px;margin:12px 0 6px}
  .wmode{flex:1;padding:7px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:12px;cursor:pointer}
  .wmode.on{border-color:var(--gold);color:var(--gold)}
  .wgraph{width:100%;height:auto;display:block}
  .wstats{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
  .kbfill.sleep{background:#67E8F9}
  .sleeptimes{display:flex;gap:10px;margin-bottom:12px}
  .sleeptimes label{flex:1;display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted)}
  .sleeptimes input{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--text);font-size:15px;outline:none}
  .ratelab,.notelab{display:block;margin:4px 0 6px}
  .stars{display:flex;gap:6px;margin-bottom:12px}
  .star{flex:1;padding:9px 0;font-size:20px;line-height:1;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--line-2,#555);cursor:pointer}
  .star.on{color:var(--gold);border-color:var(--gold)}
  #slNote{width:100%;min-height:64px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text);font-size:14px;outline:none;resize:vertical;font-family:inherit}
  .sstats{display:flex;gap:8px;margin-top:12px}
  .sstats>div{flex:1;text-align:center;background:var(--panel2);border-radius:10px;padding:10px 4px}
  .sstats b{display:block;font-size:16px}.sstats .hint{font-size:10px}
  .fin-nw{text-align:center}
  .nw-big{font-size:38px;font-weight:800;letter-spacing:-1px}
  .flowrow{display:flex;gap:8px;margin-top:14px}
  .flowrow>div{flex:1;text-align:center;background:var(--panel2);border-radius:10px;padding:9px 4px}
  .flowrow .hint{display:block;font-size:10px;margin-bottom:2px}.flowrow b{font-size:14px}
  .finadd{display:flex;gap:8px}
  .finadd input,.finadd select{width:100%;box-sizing:border-box;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--text);font-size:13.5px;outline:none}
  .finadd input:first-child{flex:1}.finadd select{flex:1}
  .finlist{margin-top:6px}
  .fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fgrid2 label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);min-width:0}
  .fgrid2 input{width:100%;box-sizing:border-box;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--text);font-size:14.5px;outline:none}
  .scntabs{display:flex;gap:6px;margin-bottom:12px}
  .scntab{flex:1;padding:8px 4px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:11.5px;cursor:pointer;text-align:center}
  .scntab.on{border-color:var(--gold);color:var(--gold)}
  .fireout{display:flex;gap:8px;margin-top:12px}
  .fireout>div{flex:1;text-align:center;background:var(--panel2);border-radius:10px;padding:12px 6px}
  .fireout b{display:block;font-size:17px}.fireout .hint{font-size:10px;margin-top:2px}
  .tips{margin:0;padding-left:18px;font-size:13px;color:var(--text2,#cfd3da)}
  .tips li{margin:6px 0}
  .scanstat{margin:12px 0 8px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}
  .spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:qspin .8s linear infinite}
  @keyframes qspin{to{transform:rotate(360deg)}}
  .scanmsg{font-weight:700;letter-spacing:.6px;font-size:14px}
  .scanmsg.ok{color:#56C596}.scanmsg.bad{color:#e06c75}
  .scanok,.scanbad{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;animation:wcin .2s ease}
  .scanok{background:rgba(86,197,150,.15);color:#56C596;border:2px solid #56C596}
  .scanbad{background:rgba(224,108,117,.15);color:#e06c75;border:2px solid #e06c75}

  .hero{padding:18px 16px;margin-bottom:18px}
  .herotop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .heroq{display:flex;flex-direction:column;gap:3px}
  .dayname{font-size:25px;font-weight:800;text-transform:uppercase;letter-spacing:.055em;line-height:1;
    background:linear-gradient(96deg,#FFF3D6, var(--accent) 45%, #FFF0CE 72%, var(--accent));background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 1px 7px color-mix(in srgb, var(--accent) 42%, transparent));animation:dnShimmer 6.5s ease-in-out infinite}
  .qsub{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  @keyframes dnShimmer{0%,100%{background-position:0 0}50%{background-position:100% 0}}
  @media (prefers-reduced-motion:reduce){.dayname{animation:none}}
  .xpnum{font-size:22px;font-weight:800}
  .goalctl{display:flex;align-items:center;gap:8px}
  .step{display:flex;flex-direction:column;gap:3px;margin-left:2px}
  .step button{background:rgba(255,255,255,.06);border:none;color:var(--muted);width:20px;height:14px;
    border-radius:4px;font-size:12px;line-height:1;cursor:pointer;padding:0}
  .bartrack{height:16px;background:rgba(255,255,255,.05);border-radius:9px;overflow:hidden;position:relative}
  .barfill{height:100%;border-radius:9px;transition:width .5s cubic-bezier(.2,.8,.2,1);
    background:linear-gradient(90deg,var(--gold),#F5C97B);position:relative}
  .barfill.clear{background:linear-gradient(90deg,var(--green),var(--gold))}
  .barfill.wk{background:linear-gradient(90deg,var(--violet),#B3A7F5)}
  .barfill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
    transform:translateX(-100%);animation:sheen 2.6s ease-in-out infinite}
  @keyframes sheen{60%,100%{transform:translateX(100%)}}
  .status{font-size:10.5px;margin-top:9px;color:var(--muted)}
  .status.clear{color:var(--green)}

  .seclabel{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;font-size:10px;
    color:var(--muted);margin:0 4px 8px;display:flex;justify-content:space-between;align-items:center}
  .seclabel .r{color:var(--muted);letter-spacing:.08em}
  .list{overflow:hidden;margin-bottom:18px}
  .row{display:flex;align-items:center;gap:11px;padding:13px 12px;min-height:44px}
  .row+.row{border-top:1px solid var(--line)}
  .row.done{opacity:.5}
  .box{width:23px;height:23px;border-radius:7px;flex-shrink:0;display:grid;place-items:center;cursor:pointer;
    border:1.5px solid rgba(255,255,255,.18);transition:all .18s}
  .box.on{background:var(--green);border-color:var(--green)}
  .box svg{opacity:0;transition:opacity .15s}
  .box.on svg{opacity:1}
  .ico{width:18px;height:18px;flex-shrink:0}
  .rbody{flex:1;min-width:0;cursor:pointer}
  .rbody .t{font-size:14.5px}
  .row.done .t{text-decoration:line-through}
  .rbody .c{font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;font-size:9.5px;color:var(--muted);margin-top:3px}
  .xp{font-family:var(--mono);font-size:12px;color:var(--gold)}
  .row.done .xp{color:var(--green)}
  .chev{color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:0 2px;flex-shrink:0}

  .cnt{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .cnt button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);
    color:var(--text);font-size:15px;line-height:1;cursor:pointer;padding:0}
  .cnt .n{font-family:var(--mono);font-size:12px;min-width:30px;text-align:center;color:var(--muted)}
  .cnt .n.full{color:var(--green)}

  .sq{padding:12px;margin-bottom:18px}
  .sqrow{display:flex;align-items:center;gap:11px;padding:9px 2px}
  .sqrow .main{display:flex;align-items:center;gap:11px;flex:1;cursor:pointer;min-width:0}
  .sqrow.done{opacity:.5}
  .sqrow .main .t{flex:1;font-size:14.5px}
  .sqrow.done .t{text-decoration:line-through}
  .del{width:20px;height:20px;color:var(--muted);cursor:pointer;flex-shrink:0}
  .addbar{display:flex;gap:8px;margin-top:10px}
  .addbar input,.addbar textarea{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:11px;color:var(--text);font-size:14.5px;outline:none;font-family:var(--sans);min-width:0}
  .addbar select{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--muted);
    font-family:var(--mono);font-size:12px;padding:0 8px;outline:none;max-width:110px}
  .addbar button{background:var(--gold);border:none;border-radius:9px;width:44px;display:grid;place-items:center;cursor:pointer;color:var(--bg);flex-shrink:0}

  .radar{padding:14px 8px 16px;margin-bottom:18px;display:flex;flex-direction:column;align-items:center}
  .radar svg{width:100%;max-width:360px;height:auto}
  .tierkey{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
  .tierkey span{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;color:var(--muted);display:flex;align-items:center;gap:4px}
  .tierkey i{width:8px;height:8px;border-radius:2px;display:inline-block}

  .weekchart{padding:16px;margin-bottom:18px}
  .bars{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:12px}
  .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
  .bars .b .fill{width:100%;background:var(--panel2);border-radius:4px 4px 0 0;min-height:3px;transition:height .4s}
  .bars .b.today .fill{background:var(--gold)}
  .bars .b .lb{font-family:var(--mono);font-size:9px;color:var(--muted)}

  .badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  .badge{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);opacity:.4;cursor:pointer}
  .badge.on{opacity:1;background:var(--panel2);border-color:var(--gold)}
  .edit{color:var(--muted);cursor:pointer;font-size:10px;letter-spacing:.08em}
  .picker{min-height:74vh;display:flex;flex-direction:column;justify-content:center}
  .pk-title{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px;letter-spacing:.2em}
  .pk-grid{display:flex;flex-direction:column;gap:12px;max-width:360px;margin:0 auto;width:100%}
  .pk-card{display:flex;align-items:center;gap:14px;padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:16px;cursor:pointer}
  .pk-card:active{background:var(--panel2)}
  .pk-card .chev{color:var(--muted);font-size:20px}
  .pk-card .rank{font-family:var(--mono);font-size:12px;font-weight:700;min-width:26px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 2px}
  .pk-card .medal{flex-shrink:0}
  .acc.gym{border-color:rgba(139,124,240,.35);cursor:pointer}
  .acc.gym .acc-chev{transform:none}
  .pk-name{font-size:17px;font-weight:600}
  .pk-sub{font-size:11px;color:var(--muted)}
  .avatar{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:22px;font-weight:700;border:1.5px solid;flex-shrink:0}
  .welcome{min-height:82vh;display:flex;align-items:center;justify-content:center;text-align:center}
  .wc-hi{font-size:12px;color:var(--muted);letter-spacing:.34em;margin-bottom:12px}
  .wc-name{font-family:Georgia,'Times New Roman',serif;font-size:46px;font-weight:600;font-style:italic;background:linear-gradient(90deg,var(--gold),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;animation:wcin .8s ease}
  .loginbox{width:100%;max-width:320px;text-align:center;animation:wcin .5s ease}
  .ro{font-size:11px;color:var(--muted);letter-spacing:.28em;margin:6px 0 20px}
  .pwin{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--text);font-size:16px;text-align:center;outline:none;letter-spacing:.15em}
  .pwin:focus{border-color:var(--gold)}
  .pwerr{min-height:20px;color:#e06c75;font-size:15px;margin:12px 0 4px;font-weight:600}
  .pwbtns{display:flex;gap:10px;margin-top:10px}
  .pwbtns .btn{flex:1;margin:0}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .robanner{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:rgba(139,124,240,.09);border:1px solid rgba(139,124,240,.28);color:var(--muted);border-radius:12px;padding:9px 13px;margin-bottom:14px;font-size:12.5px}
  .rolog{margin-left:auto;color:var(--violet);font-weight:600;cursor:pointer;text-decoration:underline}
  @keyframes wcin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .overlay{position:fixed;inset:0;background:rgba(10,11,16,.74);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top) + 54px) 16px 16px}

const dstr=(d=new Date())=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const shift=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dstr(d);};
const weekday=s=>{const g=new Date(s+'T00:00:00').getDay();return g>=1&&g<=5;};
function weekKey(s=dstr()){const d=new Date(s+'T00:00:00');const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day+3);
  const first=new Date(d.getFullYear(),0,4);const wk=1+Math.round(((d-first)/86400000-3+((first.getDay()+6)%7))/7);
  return d.getFullYear()+'-W'+String(wk).padStart(2,'0');}
function weekDates(){const t=dstr();const mon=(new Date(t+'T00:00:00').getDay()+6)%7;const start=shift(t,-mon);
  return Array.from({length:7},(_,i)=>shift(start,i));}
function streakOf(cl){const set=new Set(cl),t=dstr();let c=set.has(t)?t:(set.has(shift(t,-1))?shift(t,-1):null);if(!c)return 0;let n=0;while(set.has(c)){n++;c=shift(c,-1);}return n;}
function levelOf(x){let l=1,r=Math.max(0,x),c=100;while(r>=c){r-=c;l++;c=l*100;}return{lvl:l,into:r,cost:c};}
function rankInfo(v,tiers){v=Math.max(0,v||0);let passed=0;for(const t of tiers)if(v>=t.at)passed++;
  const cur=passed>0?tiers[passed-1]:null,next=passed<tiers.length?tiers[passed]:null;
  const lo=passed>0?tiers[passed-1].at:0,hi=next?next.at:tiers[tiers.length-1].at;
  const frac=next?(v-lo)/(hi-lo):1;const radiusFrac=(passed+(next?frac:0))/tiers.length;
  return{passed,cur,next,frac,radiusFrac,name:cur?cur.name:'—',color:cur?cur.c:'#57607A'};}
const freshDay=d=>({date:d,done:{},side:[]});
function archiveDay(u,day){if(!day||!day.date)return;u.dayLog=u.dayLog||{};
  const tasks=(u.daily||[]).map(t=>({name:t.name,xp:t.xp,done:!!(day.done&&day.done[t.id])}));
  const side=(day.side||[]).map(q=>({name:q.name,xp:q.xp,done:!!q.done}));
  let xp=0;tasks.forEach(t=>{if(t.done)xp+=t.xp;});side.forEach(q=>{if(q.done)xp+=q.xp;});
  u.dayLog[day.date]={tasks,side,xp};const ks=Object.keys(u.dayLog).sort();while(ks.length>10)delete u.dayLog[ks.shift()];}

/* ================= XP / progress ================= */
function dailyXP(){let x=0;for(const t of U().daily)if(U().today.done[t.id])x+=t.xp;for(const q of U().today.side)if(q.done)x+=q.xp;return x;}
function weekCounts(){const k=weekKey();return (U().weekly[k]&&U().weekly[k].counts)||{};}
function weeklyXP(){const c=weekCounts();let x=0;for(const q of U().weeklyDefs)x+=Math.min(c[q.id]||0,q.target)*q.xp;return x;}
function addArea(a,n){if(a&&a!=='consistency')U().areaXP[a]=(U().areaXP[a]||0)+n;}
function awardAreas(t,amt){const a1=t.area||'productivity';
  if(t.area2&&t.area2!==a1){const p=(t.split!=null?t.split:50)/100,x=Math.round(amt*p);addArea(a1,x);addArea(t.area2,amt-x);}
  else addArea(a1,amt);}
function areaValue(id){return id==='consistency'?U().cleared.length*60:Math.max(0,U().areaXP[id]||0);}

function checkProgress(){
  const t=U().today.date,xp=dailyXP();U().history[t]=xp;
  const set=new Set(U().cleared),was=set.has(t),is=xp>=U().dailyGoal;
  if(is&&!was){U().cleared.push(t);toast('✦ Day cleared');}
  if(!is&&was)U().cleared=U().cleared.filter(d=>d!==t);
  const streak=streakOf(U().cleared);
  const any=Object.values(U().today.done).some(Boolean)||U().today.side.some(q=>q.done);
  const award=id=>{if(!U().badges[id]){U().badges[id]=t;toast('🏅 '+BADGES.find(b=>b.id===id).name);}};
  if(U().daily.some(c=>c.deep&&U().today.done[c.id]))award('heavy');
  if(any&&new Date().getHours()<10)award('early');
  if(xp>=U().dailyGoal*2)award('over');
  const due=U().daily.filter(c=>c.coreDaily||(c.weekdayCore&&weekday(t)));
  if(due.length&&due.every(c=>U().today.done[c.id]))award('full');
  if(streak>=3)award('s3');if(streak>=7)award('s7');
}

function toggleDaily(id){if(!editGuard())return;const t=U().daily.find(c=>c.id===id),d=!U().today.done[id];

  const core=U().daily.filter(c=>c.coreDaily);

  persist();render();}
function bumpWeekly(id,dir){if(!editGuard())return;const q=U().weeklyDefs.find(w=>w.id===id);if(!q)return;const k=weekKey();
  U().weekly[k]=U().weekly[k]||{counts:{}};const cur=U().weekly[k].counts[id]||0,nx=Math.max(0,cur+dir);
  if(nx===cur)return;U().weekly[k].counts[id]=nx;
  const delta=(Math.min(nx,q.target)-Math.min(cur,q.target))*q.xp;
  U().totalXP+=delta;addArea(q.area,delta);U().completions=Math.max(0,(U().completions||0)+dir);checkProgress();persist();render();}

  const winY=(typeof window!=='undefined'&&window.scrollY)||0;
  if(!S.currentUser)renderPicker(app);

  else if(showWelcome)renderWelcome(app);

  else if(route.name==='task')renderTask(app,route.id);
  else if(route.name==='editcore')renderEditCore(app);

  else if(route.name==='editstats')renderEditStats(app);
  else if(route.name==='pastday')renderPastDay(app,route.date);

    const pg=app.querySelector('#pager');if(pg&&pgLeft!=null)pg.scrollLeft=pgLeft;

}

function investGraphSVG(P0,PM,rate){const yrs=20,W=300,H=130,pad=10;

/* ================= radar ================= */
function radarSVG(){
  const cx=160,cy=150,R=112,N=AREAS.length;
  const ang=i=>(Math.PI*2*i/N)-Math.PI/2;
  const pt=(i,r)=>[cx+Math.cos(ang(i))*r,cy+Math.sin(ang(i))*r];
  let grid='';
  for(let k=1;k<=STIERS.length;k++){const r=R*k/STIERS.length;
    const pts=AREAS.map((_,i)=>pt(i,r).map(v=>v.toFixed(1)).join(',')).join(' ');
    grid+=`<polygon points="${pts}" fill="none" stroke="${STIERS[k-1].c}" stroke-opacity="0.25" stroke-width="1"/>`;}
  let axes='';AREAS.forEach((_,i)=>{const p=pt(i,R);axes+=`<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="rgba(255,255,255,.08)"/>`;});
  const ris=AREAS.map(a=>rankInfo(areaValue(a.id),STIERS));
  const poly=AREAS.map((a,i)=>{const r=R*ris[i].radiusFrac;return pt(i,r).map(v=>v.toFixed(1)).join(',');}).join(' ');
  const dots=AREAS.map((a,i)=>{const r=R*ris[i].radiusFrac,p=pt(i,r);return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${ris[i].color}"/>`;}).join('');
  let labels='';AREAS.forEach((a,i)=>{const p=pt(i,R+15),x=p[0],y=p[1];const anc=Math.abs(x-cx)<10?'middle':(x>cx?'start':'end');
    labels+=`<text x="${x.toFixed(1)}" y="${(y-3).toFixed(1)}" fill="var(${a.v})" font-size="9" font-family="ui-monospace,monospace" letter-spacing="1" text-anchor="${anc}">${(U().areaLabels[a.id]||a.name).toUpperCase()}</text>`;
    labels+=`<text x="${x.toFixed(1)}" y="${(y+8).toFixed(1)}" fill="${ris[i].color}" font-size="8" font-family="ui-monospace,monospace" text-anchor="${anc}">${ris[i].name==='—'?'unranked':ris[i].name}</text>`;});
  return `<svg viewBox="-46 -8 412 316" xmlns="http://www.w3.org/2000/svg">${grid}${axes}
    <polygon points="${poly}" fill="rgba(242,177,76,.14)" stroke="var(--gold)" stroke-width="1.5"/>${dots}${labels}</svg>`;
}
function weekBars(){const dates=weekDates(),t=dstr();const vals=dates.map(d=>U().history[d]||0);const mx=Math.max(...vals,U().dailyGoal);
  const L=['M','T','W','T','F','S','S'];
  return `<div class="bars">${dates.map((d,i)=>`<div class="b${d===t?' today':''}">
    <div class="fill" style="height:${Math.round((vals[i]/mx)*100)}%"></div><div class="lb">${L[i]}</div></div>`).join('')}</div>`;
}

/* ================= gym: volume + body map ================= */
function muscleVolume(){const map={};S.gym.days.forEach(d=>d.ex.forEach(e=>map[e.id]=e.mus||[]));
  const vol={};MUSCLES.forEach(m=>vol[m.id]=0);
  for(const date in U().gymSessions){const ent=U().gymSessions[date].entries||{};
    for(const exId in ent){const mus=map[exId]||[];if(!mus.length)continue;let t=0;
      ent[exId].forEach(s=>{t+=(parseFloat(s.w)||0)*(parseFloat(s.r)||0);});
      mus.forEach(m=>{if(vol[m]!==undefined)vol[m]+=t;});}}
  return vol;}
function cvar(v){const m=/var\((--[\w]+)\)/.exec(v);if(!m)return v;return getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim()||v;}

    ${R(71,52,18,21,5,F('chest'),'chest')}${R(91,52,18,21,5,F('chest'),'chest')}${R(79,75,22,30,5,F('abs'),'abs')}

function cnum(v){v=parseFloat(String(v==null?'':v).replace(',','.'));return isNaN(v)?0:v;}
function n0(x){return Math.round(x).toLocaleString();}
function n1(x){return Math.round(x*10)/10;}
function n2(x){return Math.round(x*100)/100;}
function pct(p,t){return t?Math.round(p/t*100)+'%':'—';}
function goalLabel(g){return g==='fatloss'?'Fat loss':g==='recomp'?'Recomp':g==='gain'?'Muscle gain':'Maintain';}
function bmiClass(v){return v<18.5?'Underweight':v<25?'Normal':v<30?'Overweight':v<35?'Obese I':v<40?'Obese II':'Obese III';}
function bfClass(v,sex){if(sex==='female')return v<14?'Essential':v<21?'Athletic':v<25?'Fitness':v<32?'Average':'Obese';return v<6?'Essential':v<14?'Athletic':v<18?'Fitness':v<25?'Average':'Obese';}
function whtrClass(v){return v<0.4?'Extremely slim':v<0.5?'Healthy':v<0.6?'Increased risk':'High risk';}
function whrClass(v,sex){if(sex==='female')return v<0.80?'Low risk':v<0.85?'Moderate':'High risk';return v<0.90?'Low risk':v<1.0?'Moderate':'High risk';}
function ffmiClass(v){return v<18?'Below average':v<20?'Average':v<22?'Above average':v<23?'Excellent':v<25?'Superior':v>26?'Beyond natural':'Elite';}

function computeReport(i){
  const w=cnum(i.weight),h=cnum(i.height),age=cnum(i.age),sex=i.sex||'male';
  if(!w||!h||!age)return null;
  const hm=h/100, bmi=w/(hm*hm);
  let bf=(i.bf!==''&&i.bf!=null&&cnum(i.bf)>0)?cnum(i.bf):null, bfMethod=bf!=null?'entered':null;
  if(bf==null){const neck=cnum(i.neck),waist=cnum(i.waist),hip=cnum(i.hip);
    if(neck&&waist&&waist>neck&&sex==='male'){bf=86.010*Math.log10(waist-neck)-70.041*Math.log10(h)+36.76;bfMethod='Navy (men)';}
    else if(neck&&waist&&hip&&sex==='female'){bf=163.205*Math.log10(waist+hip-neck)-97.684*Math.log10(h)-78.387;bfMethod='Navy (women)';}}
  if(bf!=null)bf=Math.max(2,Math.min(60,bf));
  const lbm=bf!=null?w*(1-bf/100):null;
  const mifflin=10*w+6.25*h-5*age+(sex==='male'?5:-161);
  const katch=lbm!=null?370+21.6*lbm:null, cunn=lbm!=null?500+22*lbm:null;
  let bmr,bmrF;
  if(i.athlete&&lbm!=null){bmr=cunn;bmrF='Cunningham';}
  else if(lbm!=null){bmr=katch;bmrF='Katch-McArdle';}
  else{bmr=mifflin;bmrF='Mifflin-St Jeor';}
  const mult=cnum(i.activity)||1.375, maint=cnum(i.maint), tdee=maint>0?maint:bmr*mult, tdeeSrc=maint>0?'your maintenance':'BMR ×'+mult;
  const goal=i.goal||'recomp';
  const adj=goal==='fatloss'?-500:goal==='recomp'?-250:goal==='gain'?250:0;
  const floor=sex==='male'?1500:1200;
  let target=tdee+adj,floored=false;if(target<floor){target=floor;floored=true;}
  const lbmFloor=lbm!=null?20*lbm:null, belowLbm=lbmFloor!=null&&target<lbmFloor;
  const pFac=goal==='gain'?2.0:goal==='maintain'?1.8:2.2;
  const protG=pFac*w, protK=protG*4;
  let fatG=0.9*w; const fatMin=0.5*w; if(fatG<fatMin)fatG=fatMin; const fatK=fatG*9;
  const carbG=Math.max(0,(target-protK-fatK)/4), carbK=carbG*4;
  const fiber=Math.round(14*target/1000), wtChange=(target-tdee)*7/7700;
  const train={cal:target+200,carb:carbG+50}, rest={cal:Math.max(floor,target-200),carb:Math.max(0,carbG-50)};
  const rfFat=0.5*w, rfFatK=rfFat*9, refeed={cal:tdee,carb:Math.max(0,(tdee-protK-rfFatK)/4),fat:rfFat};
  const waist=cnum(i.waist),hip=cnum(i.hip);
  const whtr=waist&&h?waist/h:null, whr=waist&&hip?waist/hip:null;
  const ffmi=lbm!=null?lbm/(hm*hm):null, ffmiN=ffmi!=null?ffmi+6.1*(1.8-hm):null;
  return {date:dstr(),sex,w,h,age,bmi,bf,bfMethod,lbm,mifflin,katch,cunn,bmr,bmrF,mult,tdee,tdeeSrc,goal,adj,target,floored,floor,belowLbm,
    protG,protK,fatG,fatK,carbG,carbK,fiber,wtChange,train,rest,refeed,whtr,whr,ffmiN};
}

function weightGraphSVG(){const s=weightSeries(weightMode);
  if(s.length<1)return '<div class="hint" style="padding:12px 0">Log your weight to start the trend.</div>';
  const W=300,H=118,pad=10,vals=s.map(p=>p.v);let mn=Math.min(...vals),mx=Math.max(...vals);if(mn===mx){mn-=1;mx+=1;}const rng=mx-mn;
  const X=i=>s.length<=1?W/2:pad+i*(W-2*pad)/(s.length-1),Y=v=>H-pad-((v-mn)/rng)*(H-2*pad);
  const pts=s.map((p,i)=>[X(i),Y(p.v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const n=s.length;let sx=0,sy=0,sxy=0,sxx=0;s.forEach((p,i)=>{sx+=i;sy+=p.v;sxy+=i*p.v;sxx+=i*i;});
  const slope=n>1?(n*sxy-sx*sy)/(n*sxx-sx*sx):0,inter=(sy-slope*sx)/n;
  const trend=`M ${X(0).toFixed(1)} ${Y(inter).toFixed(1)} L ${X(n-1).toFixed(1)} ${Y(inter+slope*(n-1)).toFixed(1)}`;
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="var(--gold)"/>`).join('');
  const chg=(s[n-1].v-s[0].v);
  return `<svg viewBox="0 0 ${W} ${H}" class="wgraph">${n>1?`<path d="${trend}" stroke="var(--violet)" stroke-width="2" fill="none" stroke-dasharray="4 3" opacity=".85"/>`:''}
    <path d="${line}" stroke="var(--gold)" stroke-width="1.5" fill="none"/>${dots}</svg>
    <div class="wstats mono"><span>${n} pt${n===1?'':'s'}</span><span>${s[0].v.toFixed(1)} → ${s[n-1].v.toFixed(1)} kg</span><span style="color:${chg>0?'#e06c75':(chg<0?'#56C596':'var(--muted)')}">${chg>=0?'+':''}${chg.toFixed(1)} kg</span></div>`;}

      <div class="hint" style="grid-column:1/-1;margin-top:-2px">Most people overestimate activity — pick low. Know your maintenance? Enter it above to override the estimate.</div>
    </div>
    <button class="btn" id="calcBtn" style="margin-top:14px">Calculate &amp; save report</button>
  </div>
  ${U().calc.report?reportBlockHTML(U().calc.report):'<div class="dsub" style="margin:2px 4px 20px">Fill the form and calculate to generate <b>Your Report</b> — BMI, body fat, LBM, FFMI, BMR, TDEE, calorie target and full macros.</div>'}`;
}
function wireCalc(root){
  const f=id=>root.querySelector('#'+id);
  const wl=f('wtLog');if(wl)wl.onclick=()=>logWeight(f('wtInput').value);
  const wi=f('wtInput');if(wi)wi.onkeydown=e=>{if(e.key==='Enter')logWeight(wi.value);};
  root.querySelectorAll('[data-wmode]').forEach(e=>e.onclick=()=>{weightMode=e.dataset.wmode;render();});
  const ids=['c_sex','c_age','c_weight','c_height','c_bf','c_neck','c_waist','c_hip','c_maint','c_activity','c_goal','c_athlete'];
  const save=()=>{U().calc.inputs={sex:f('c_sex').value,age:f('c_age').value,weight:f('c_weight').value,height:f('c_height').value,
    bf:f('c_bf').value,neck:f('c_neck').value,waist:f('c_waist').value,hip:f('c_hip').value,
    activity:f('c_activity').value,goal:f('c_goal').value,athlete:f('c_athlete').checked,maint:f('c_maint').value};persist();};
  ids.forEach(id=>{const el=f(id);if(el)el.onchange=save;});
  root.querySelectorAll('[data-acc]').forEach(h=>h.onclick=e=>{e.stopPropagation();h.closest('.acc').classList.toggle('open');});
  const btn=f('calcBtn');if(btn)btn.onclick=()=>{save();const rep=computeReport(U().calc.inputs);
    if(!editGuard())return;if(!rep){toast('Enter weight, height & age');return;}U().calc.report=rep;persist();render();toast('✦ Report saved');};
}

/* ================= cloud sync + auth (Supabase) ================= */
const APP_VERSION='v32 · smooth-render';
const _QC=(typeof window!=='undefined'&&window.QLCONFIG)||{};
const CLOUD={url:_QC.url||'',anon:_QC.anon||'',
  emails:{matt:'matt@questlog.app',jerry:'jerry@questlog.app',alexio:'alexio@questlog.app',d4:'d4@questlog.app',Frost:'frost@questlog.app',george:'george@questlog.app',terka:'terka@questlog.app'}};
let sb=null, authUser=null, loginFor=null, pwFails={}, pulling=false, pushT=null, dirty=false, synced=false;
function cloudReady(){return !!(CLOUD.url&&CLOUD.anon&&window.supabase);}
function cloudOn(){return cloudReady()&&sb!==null;}
function canEdit(){return cloudOn()?authUser===S.currentUser:true;}
function editGuard(){if(cloudOn()&&!canEdit()){toast('Read-only · log in to edit');return false;}return true;}
function initCloud(){if(cloudReady()&&!sb){try{sb=window.supabase.createClient(CLOUD.url,CLOUD.anon,{auth:{persistSession:true,autoRefreshToken:true}});}catch(e){sb=null;}}}
async function refreshAuth(){if(!cloudOn()){authUser=null;return;}try{const{data}=await sb.auth.getUser();const em=data&&data.user&&data.user.email;authUser=em?(Object.keys(CLOUD.emails).find(k=>CLOUD.emails[k]===em)||null):null;}catch(e){authUser=null;}}
async function cloudPull(self){if(!cloudOn())return;try{const{data,error}=await sb.from('profiles').select('id,data');if(error||!data)return;synced=true;pulling=true;
  data.forEach(r=>{const has=r.data&&Object.keys(r.data).length>0;if(!has)return;
    const cloudV=(r.data._v)||0,localV=(S.users[r.id]&&S.users[r.id]._v)||0;
    if(r.id==='shared'){if(!self&&dirty)return;if(r.data.gym)S.gym=Object.assign(defGym(),r.data.gym,{ver:GYM_VER});}
    else if(r.id===authUser){if(!self&&dirty&&cloudV<=localV)return;S.users[r.id]=r.data;dirty=false;}
    else if(S.users[r.id]){S.users[r.id]=r.data;}});
  normalizeGym();normalizeUsers();pulling=false;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}catch(e){pulling=false;}}
function roBanner(){return cloudOn()&&!canEdit()?`<div class="robanner">${svg(P.moon,'class="ico" style="width:14px;height:14px;vertical-align:-2px"')} Read-only — <span class="rolog" data-rologin>log in${U()?' as '+U().name:''} to edit</span></div>`:'';}
function wireRoBanner(app){const rl=app.querySelector('[data-rologin]');if(rl)rl.onclick=()=>{loginFor=S.currentUser;render();};}
function cloudPush(){if(pulling||!cloudOn()||!authUser||!synced)return;dirty=true;S.users[authUser]._v=Date.now();clearTimeout(pushT);pushT=setTimeout(async()=>{try{
  const r1=await sb.from('profiles').update({data:S.users[authUser]}).eq('id',authUser);
  const r2=await sb.from('profiles').update({data:{gym:S.gym}}).eq('id','shared');
  if((r1&&r1.error)||(r2&&r2.error)){toast('⚠ sync failed — check connection');}else{dirty=false;}}catch(e){toast('⚠ sync failed — check connection');}},700);}
async function cloudLogin(pid,password){if(!cloudOn())return false;try{const{error}=await sb.auth.signInWithPassword({email:CLOUD.emails[pid],password});if(error)return false;authUser=pid;await cloudPull(true);return true;}catch(e){return false;}}
function cloudSubscribe(){if(!cloudOn()||!sb.channel)return;try{sb.channel('profiles-rt').on('postgres_changes',{event:'*',schema:'public',table:'profiles'},payload=>{
  const r=payload.new;if(!r||!r.id)return;const cloudV=(r.data&&r.data._v)||0,localV=(S.users[r.id]&&S.users[r.id]._v)||0;
  if(r.id==='shared'){if(dirty)return;if(r.data&&r.data.gym)S.gym=Object.assign(defGym(),r.data.gym,{ver:GYM_VER});}
  else{if(r.id===authUser&&dirty&&cloudV<=localV)return;if(S.users[r.id]&&r.data&&Object.keys(r.data).length){S.users[r.id]=r.data;if(r.id===authUser)dirty=false;}}
  normalizeGym();normalizeUsers();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}syncRender();}).subscribe();}catch(e){}}
async function flushNow(){if(!cloudOn()||!authUser||!dirty||!synced)return;clearTimeout(pushT);S.users[authUser]._v=Date.now();try{
  const r1=await sb.from('profiles').update({data:S.users[authUser]}).eq('id',authUser);
  const r2=await sb.from('profiles').update({data:{gym:S.gym}}).eq('id','shared');
  if(!((r1&&r1.error)||(r2&&r2.error)))dirty=false;}catch(e){}}
function typing(){const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);}
let lastInteract=0,_srT=null;
function markInteract(){lastInteract=Date.now();}
function syncRender(){if(typing()||Date.now()-lastInteract<600){clearTimeout(_srT);_srT=setTimeout(()=>{if(!typing()&&Date.now()-lastInteract>=550)render();},700);return;}render();}
async function reconcile(){if(!cloudOn())return;await cloudPull(false);if(dirty)await flushNow();syncRender();}
function enterProfile(pid){S.currentUser=pid;route={name:'home'};profileOpen=false;persist();
  if(cloudOn()&&authUser!==pid){loginFor=pid;render();}else{showWelcome=true;render();}}
function renderLogin(app,pid){
  const u=S.users[pid],fails=pwFails[pid]||0;
  app.innerHTML=`<div class="welcome"><div class="loginbox">
    <div class="wc-hi mono">Welcome back</div>
    <div class="wc-name">${u.name}</div>
    <div class="ro mono">( Read-Only )</div>
    <input id="pw" type="password" class="pwin" placeholder="Password"/>
    <div class="pwerr">${fails>=2?'fuck u doin bro 😭':''}</div>
    <div class="pwbtns"><button class="btn ghost" id="roBtn">View read-only</button><button class="btn" id="loginBtn">Log in</button></div>
  </div></div>`;
  const done=()=>{loginFor=null;showWelcome=true;render();};
  app.querySelector('#roBtn').onclick=done;
  const tryLogin=async()=>{const b=app.querySelector('#loginBtn');b.textContent='…';b.disabled=true;
    const ok=await cloudLogin(pid,app.querySelector('#pw').value);
    if(ok){pwFails[pid]=0;done();}else{pwFails[pid]=(pwFails[pid]||0)+1;render();}};
  app.querySelector('#loginBtn').onclick=tryLogin;
  app.querySelector('#pw').onkeydown=e=>{if(e.key==='Enter')tryLogin();};
}

/* ================= boot ================= */
try{
  S=loadState();
  if(!S||!S.users)S=defState();
  if(!S.users)S.users=defState().users;
  normalizeGym();normalizeUsers();
  persist();render();
  if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});
    let _refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(_refreshing)return;_refreshing=true;location.reload();});}
  window.addEventListener('load',()=>{initCloud();['touchstart','touchmove','pointerdown','wheel','scroll'].forEach(ev=>window.addEventListener(ev,markInteract,{passive:true,capture:true}));if(cloudOn()){refreshAuth().then(()=>cloudPull(true)).then(()=>{render();cloudSubscribe();});
    document.addEventListener('visibilitychange',()=>{if(!cloudOn())return;if(document.visibilityState==='hidden')flushNow();else reconcile();});
    window.addEventListener('focus',()=>{if(cloudOn())reconcile();});
    window.addEventListener('pagehide',()=>{if(cloudOn())flushNow();});
    window.addEventListener('blur',()=>{if(cloudOn())flushNow();});}});
}catch(err){document.getElementById('app').innerHTML='<div style="color:#8A90A2;font-family:monospace;padding:20px">Reset needed — '+err.message+'</div>';}
</script>
